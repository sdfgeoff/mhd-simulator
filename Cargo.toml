[package]
name = "mhd-workbench"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
wgpu = "24.0.5"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
gltf = "1.4"
serde_json = "1"
step-io = { path = "vendor/step-io" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
